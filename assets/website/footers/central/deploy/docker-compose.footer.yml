# ---------------------------------------------------------------------------
# Serve the AT Medical central footer SAME-ORIGIN on every Traefik-fronted
# domain, under the path /_atmed/footer/. A tiny nginx container serves the
# static files; a host-less PathPrefix router attaches it to all domains, so
# https://<any-domain>/_atmed/footer/footer.js resolves without cross-origin.
#
# Deploy on ATINFRA-gateway alongside the Traefik stack. The ./central mount
# is kept up to date by sync-footer.sh (from ATMED-assets).
# ---------------------------------------------------------------------------
services:
  atmed-footer:
    image: nginx:alpine
    container_name: atmed-footer
    restart: unless-stopped
    volumes:
      # Mounted so the files resolve at /_atmed/footer/<file>
      - ./central:/usr/share/nginx/html/_atmed/footer:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # Host-less rule => matches the path on ALL domains (same-origin).
      - "traefik.http.routers.atmed-footer.rule=PathPrefix(`/_atmed/footer/`)"
      - "traefik.http.routers.atmed-footer.priority=10000"
      - "traefik.http.routers.atmed-footer.entrypoints=websecure"
      - "traefik.http.routers.atmed-footer.tls=true"
      - "traefik.http.services.atmed-footer.loadbalancer.server.port=80"
      # Short cache; footer updates should appear quickly across surfaces.
      - "traefik.http.middlewares.atmed-footer-cache.headers.customresponseheaders.Cache-Control=public, max-age=300"
      - "traefik.http.routers.atmed-footer.middlewares=atmed-footer-cache"

networks:
  traefik:
    external: true
