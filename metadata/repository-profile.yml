# ATMED-assets — Repository Profile
# AT Medical Enterprise Repository Profile
# Canonical configuration for workflows, tagging and governance automation.
# Do not modify without authorisation from the primary team maintainer.
# Maintained by AT Medical Infrastructure Team

# ── Identity ─────────────────────────────────────────────────────────────────
repository_name: ATMED-assets
repository_type: assets
repository_domain: brand-identity
visibility_class: public
# primary_team: lead governance team (brand/design for asset decisions)
primary_team: infrastructure-team
secondary_teams:
  - design-communications
  - platform-engineering
  - admin-team
  - devops-team
  - design-team

# ── Legacy compatibility keys (used by repo-self-check and governance workflows)
repo-name: ATMED-assets
repo-type: assets
domain:
  - assets
  - branding
  - logos
visibility: public
customer-facing: true

deploy-targets:
  - r2
  - cdn
  - webspace
  - github-releases

teams:
  primary: infrastructure-team
  secondary:
    - admin-team
    - devops-team
    - design-team
    - design-communications

review: required

topics:
  - domain:assets
  - domain:branding
  - domain:logos
  - visibility:public
  - deploy-target:r2
  - deploy-target:cdn
  - owner:infrastructure-team
  - owner:design-team

status: active
version: 0.9.0

# ── Extended governance fields ────────────────────────────────────────────────
deploy_targets:
  - r2
  - cdn
  - webspace
  - github-releases

status_relevance: high
customer_facing: true
sensitivity_level: medium

artifact_intake_allowed: false
vps_import_allowed: false
webspace_import_allowed: true
r2_import_allowed: true

# Governance
review_policy: required
min_reviewers: 1
code_owner_required: true
auto_merge_allowed: false

# Lifecycle
lifecycle_state: active
maintenance_level: maintained
release_channel: stable

# Tagging
default_tags:
  domain: brand-identity
  repo-type: assets
  team-owner: design-communications
  security-class: proprietary
  visibility: public
  review-level: mandatory
  lifecycle-state: active
  maintenance-level: maintained
