<!--
  ATMED Global Footer template.
  Tokens ({{...}}) are replaced by scripts/build-footer.mjs.
  Do NOT edit dist/ output by hand - edit this template + footer.config.json instead.
-->
<footer class="atmed-footer" role="contentinfo" aria-label="AT Medical Footer" data-atmed-footer-version="{{VERSION}}" data-atmed-footer-variant="{{VARIANT}}">
  <div class="atmed-footer__inner">
    <div class="atmed-footer__brand">
      {{LOGO}}
      <p class="atmed-footer__claim">{{COMPANY_CLAIM}}</p>
    </div>
    <nav class="atmed-footer__nav" aria-label="Footer-Navigation">
      {{LINK_GROUPS}}
    </nav>
  </div>
  <div class="atmed-footer__bar">
    <p class="atmed-footer__copyright">
      <span>{{COPYRIGHT_LINE}}</span>
      <span class="atmed-footer__rights">{{COPYRIGHT_RIGHTS}}</span>
    </p>
    {{SOCIAL}}
  </div>
</footer>
